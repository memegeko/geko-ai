name: Check geko.ai

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Check types
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Exercise packaged production runtime
        run: pnpm run test:production
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile local -f compose.yaml -f deploy/compose.nvidia.yaml config --quiet
          rm .env
      - name: Build container image
        run: docker build -t geko-ai:ci .
      - name: Exercise installer with real containers, without model weights
        run: |
          sudo bash install.sh --dir "$GITHUB_WORKSPACE" --no-deps --non-interactive --url http://localhost:3000 --admin-email ci@example.test --skip-model --gpu cpu
          curl --fail http://localhost:3000/api/auth/config
          sudo docker compose exec -T app node -e "fetch('http://ollama:11434/api/tags').then(async r=>{if(!r.ok||(await r.json()).models.length)process.exit(1)})"
      - name: Container logs
        if: failure()
        run: sudo docker compose logs --tail=100 || true
      - name: Stop test containers
        if: always()
        run: sudo docker compose down || true
